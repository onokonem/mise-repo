# versions.toml — the ONE place to review and adjust the tools matrix.
#
# Everything is FIXED here (no dynamic resolution at build time): bump a value
# and the next publish moves that cell. Read by the Go pipeline
# (.mise/internal/provider, via BurntSushi/toml).
#
# Two kinds of tool under [tools]:
#
#   [tools.go]                MIRRORED. Map of clean selector key -> official
#                             upstream Go tarball tag. Downloaded as-is
#                             (byte-identical), never built.
#
#   [[tools.<name>]]          BUILT via `go install <path>@<version>`. Repeat the
#                             subtable to publish MULTIPLE versions of the same
#                             tool — the repo then serves old and new build
#                             configs (e.g. golangci-lint v1 and v2, which live
#                             at different module paths). Each version is built
#                             once per (buildgo, os, arch) cell with
#                             CGO_ENABLED=0. The clean selector key (major.minor
#                             derived from `version`) must be unique per tool.
#
# Tool list sourced from the provider Dockerfiles (Tools.txt = current,
# Tools-old.txt = previous), minus the private yadro.dev/yadro.com tools and the
# non-Go tools (sg3_utils, librrd, mise).
#
# Build matrix axes ([matrix].go_versions x {linux,darwin} x {amd64,arm64}) are
# applied to every (tool, version) pair.

[matrix]
# Clean selector keys exposed to consumers (the version field in manifest.json).
go_versions = ["1.25", "1.26", "1.27-beta"]

# ---- mirrored tool -------------------------------------------------------

[tools.go]
"1.25" = "go1.25.9"
"1.26" = "go1.26.5"
# 1.27 has only release candidates upstream so far (no go1.27beta<N> yet).
# Key stays "1.27-beta" for consumers; swap to a real go1.27beta<N> when it ships.
"1.27-beta" = "go1.27rc2"

# ---- built tools ---------------------------------------------------------
# Each entry built with:
#   GOOS=<os> GOARCH=<arch> CGO_ENABLED=0 GOBIN=<dir> \
#     go install -trimpath -ldflags="-s -w" <path>@<version>
# `binary` = resulting binary name. Add [[tools.<name>]] again to publish
# another version (different major versions usually need a different `path`,
# e.g. the /v2 or /v3 module suffix).

# golangci-lint: v2 (current) + v1 (legacy). Different module paths.
[[tools.golangci-lint]]
version = "v2.12.2"
path    = "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"
binary  = "golangci-lint"
[[tools.golangci-lint]]
version = "v1.64.8"
